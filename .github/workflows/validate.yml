name: XSD validation

on:
  push:
  pull_request:

jobs:
  xmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Validate CARF examples against the Anexo T6.17 XSD
        run: |
          for f in examples/*.xml; do
            xmllint --noout --schema schemas/dian-t6.17-carf-v1.5/CARFXML_v1.5.xsd "$f"
          done
